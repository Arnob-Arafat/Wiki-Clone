{% extends "encyclopedia/layout.html" %}

{% block title %}
    Edit
{% endblock %}

{% block body %}
    <form action="{% url 'edit' name %}" method="post">
        {% csrf_token %}
        <div class="mb-4 pb-2 border-bottom">
            <h2 class="display-4 font-weight-bold text-dark" style="font-size: 2.2rem;">Editing: <span class="text-primary">{{ name }}</span></h2>
            <p class="text-muted small mb-0">Modify the markdown content below. The entry title cannot be changed.</p>
        </div>

        <div class="form-group">
            <label for="user_provided_content" class="font-weight-bold">Content</label>
            <textarea id="user_provided_content" 
                      name="content" 
                      class="form-control" 
                      rows="8" 
                      placeholder="Write your markdown content here..." 
                      style="font-family: monospace;" 
                      required>{{ content }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-lg px-4">Save</button>
    </form>
{% endblock %}
